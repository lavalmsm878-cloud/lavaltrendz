<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3ECDC;
  --cream-deep:#EAE0C9;
  --surface:#FFFDF9;
  --ink:#2B231A;
  --ink-soft:#7A6E5C;
  --walnut:#4A3524;
  --gold:#AD8434;
  --gold-light:#E7D9B5;
  --brick:#8A3D2C;
  --line:#E1D5B8;
  --radius:14px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ===== Header ===== */
header{
  position:sticky; top:0; z-index:40;
  background:var(--surface);
}
.header-top{
  max-width:1100px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  gap:18px; padding:14px 20px 0;
}
.brand{display:flex; align-items:center; gap:10px;}
.lt-badge{
  width:44px; height:44px; border-radius:50%;
  border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); flex:0 0 auto;
}
.lt-badge span{font-family:'Cinzel',serif; font-weight:600; font-size:16px; color:var(--gold); letter-spacing:-1px;}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text .name{
  font-family:'Cinzel',serif; font-weight:600;
  font-size:22px; letter-spacing:2px; color:var(--walnut); text-transform:uppercase;
}
.brand-text .tag{font-family:'Amiri',serif; font-size:12.5px; color:var(--gold);}

.header-right{display:flex; align-items:center; gap:12px;}
.search-wrap{flex:1; max-width:280px; position:relative;}
.search-wrap input{
  width:100%; padding:9px 38px 9px 14px;
  border-radius:999px; border:1px solid var(--line);
  background:var(--cream); color:var(--ink); font-family:'Tajawal',sans-serif; font-size:14px;
}
.search-wrap input::placeholder{color:var(--ink-soft);}
.search-wrap input:focus{outline:1.5px solid var(--gold);}
.search-icon{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:15px;}
[dir="ltr"] .search-icon{right:auto; left:12px;}
[dir="ltr"] .search-wrap input{padding:9px 14px 9px 38px;}

.lang-toggle{
  flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--walnut);
  background:transparent; color:var(--walnut); font-family:'Tajawal',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
}

.hero{
  background:#EFE1C4;
  padding:24px 20px 20px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.hero img{
  max-width:min(480px,90%); width:100%; height:auto; display:block;
}
.brand-story{
  max-width:560px; text-align:center; margin:10px 0 0;
  font-size:13px; color:var(--walnut); line-height:1.8;
}

.social-row{
  max-width:1100px; margin:0 auto; padding:10px 20px 0;
  display:flex; gap:16px; justify-content:flex-end;
}
.social-row a{color:var(--walnut); font-size:12.5px; text-decoration:none; border-bottom:1px solid var(--gold); padding-bottom:1px;}

/* ===== Delivery banner ===== */
.delivery-banner{
  background:var(--walnut); color:#fff;
  text-align:center; padding:9px 16px;
  font-size:13px; font-weight:500;
  display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
}
.delivery-banner b{color:var(--gold-light); font-weight:700;}

.cats-row{
  max-width:1100px; margin:12px auto 0;
  display:flex; gap:8px; overflow-x:auto; padding:0 20px 14px;
  scrollbar-width:none;
}
.cats-row::-webkit-scrollbar{display:none;}
.cat-pill{
  flex:0 0 auto;
  padding:7px 18px;
  border-radius:999px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--walnut);
  font-family:'Tajawal',sans-serif; font-size:13.5px; font-weight:500;
  cursor:pointer;
  white-space:nowrap;
}
.cat-pill.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
}

/* ===== Grid ===== */
main{max-width:1100px; margin:0 auto; padding:22px 20px 100px;}
.count-line{color:var(--ink-soft); font-size:13.5px; margin:0 2px 14px;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:18px;
}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(43,35,26,.10);
}
.card-img{
  aspect-ratio:4/5; width:100%; overflow:hidden; position:relative; background:var(--cream-deep);
  cursor:zoom-in;
}
.card-img img{width:100%; height:100%; object-fit:cover; display:block;}
.card-badge{
  position:absolute; top:8px; right:8px;
  background:var(--brick); color:#fff; font-size:10.5px; font-weight:700;
  padding:4px 9px; border-radius:999px; letter-spacing:.3px;
}
[dir="ltr"] .card-badge{right:auto; left:8px;}
.card-body{padding:12px 13px 13px; display:flex; flex-direction:column; gap:6px; flex:1;}
.card-cat{font-size:11px; color:var(--gold); font-weight:700; letter-spacing:.4px;}
.card-name{font-size:14.5px; font-weight:500; line-height:1.35; margin:0; min-height:38px;}
.card-size{font-size:11.5px; color:var(--ink-soft);}
.card-stock{font-size:11.5px; color:var(--brick); font-weight:700;}
.card-price{font-family:'Tajawal',sans-serif; font-size:17px; font-weight:700; color:var(--walnut); margin-top:auto;}
.add-btn{
  margin-top:4px;
  width:100%; padding:8px 0;
  border-radius:9px; border:1px solid var(--walnut);
  background:transparent; color:var(--walnut);
  font-family:'Tajawal',sans-serif; font-weight:700; font-size:13.5px;
  cursor:pointer; transition:.15s;
}
.add-btn:hover{background:var(--walnut); color:#fff;}
.qty-row{
  margin-top:4px; display:flex; align-items:center; justify-content:space-between;
  background:var(--walnut); border-radius:9px; overflow:hidden;
}
.qty-row button{background:transparent; border:none; color:#fff; font-size:17px; width:34px; height:32px; cursor:pointer;}
.qty-row span{color:#fff; font-weight:700; font-size:14px;}

/* ===== Lightbox ===== */
.lightbox-overlay{
  position:fixed; inset:0; background:rgba(20,15,10,.82); z-index:80;
  display:none; align-items:center; justify-content:center; padding:24px;
}
.lightbox-overlay.open{display:flex;}
.lightbox-overlay img{max-width:min(560px,92vw); max-height:82vh; border-radius:10px; object-fit:contain;}
.lightbox-close{
  position:absolute; top:18px; left:18px; background:rgba(255,255,255,.15); color:#fff;
  border:none; border-radius:50%; width:38px; height:38px; font-size:20px; cursor:pointer;
}

/* ===== Floating cart button ===== */
.cart-fab{
  position:fixed; left:18px; bottom:18px; z-index:50;
  background:var(--brick); color:#fff;
  border:none; border-radius:999px;
  padding:13px 20px 13px 16px;
  display:flex; align-items:center; gap:10px;
  font-family:'Tajawal',sans-serif; font-weight:700; font-size:14.5px;
  cursor:pointer; box-shadow:0 4px 14px rgba(43,35,26,.22);
}
.cart-fab .badge{
  background:#fff; color:var(--brick);
  border-radius:999px; min-width:22px; height:22px; padding:0 5px;
  display:flex; align-items:center; justify-content:center; font-size:12.5px;
}

/* ===== Drawer ===== */
.overlay{position:fixed; inset:0; background:rgba(43,35,26,.45); z-index:60; display:none;}
.overlay.open{display:block;}
.drawer{
  position:fixed; top:0; bottom:0; left:0; width:min(400px,92vw);
  background:var(--cream); z-index:61;
  transform:translateX(-105%); transition:transform .25s ease;
  display:flex; flex-direction:column;
}
[dir="ltr"] .drawer{left:auto; right:0; transform:translateX(105%);}
.drawer.open{transform:translateX(0);}
.drawer-head{
  padding:18px 18px 14px; background:var(--walnut); color:#fff;
  display:flex; align-items:center; justify-content:space-between;
}
.drawer-head h2{font-family:'Tajawal',sans-serif; font-size:19px; font-weight:700; margin:0; letter-spacing:.3px;}
.drawer-head button{background:none; border:none; color:#fff; font-size:22px; cursor:pointer;}
.drawer-body{flex:1; overflow-y:auto; padding:14px 16px;}
.empty-cart{color:var(--ink-soft); text-align:center; padding:60px 20px; font-size:14px;}
.cart-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.cart-item img{width:58px; height:58px; border-radius:8px; object-fit:cover; flex:0 0 auto;}
.ci-info{flex:1; min-width:0;}
.ci-name{font-size:13.5px; font-weight:500; margin:0 0 3px;}
.ci-price{font-size:12.5px; color:var(--ink-soft);}
.ci-controls{display:flex; align-items:center; gap:8px; margin-top:6px;}
.ci-controls button{width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; line-height:1;}
.ci-remove{background:none; border:none; color:var(--brick); font-size:12px; cursor:pointer; text-decoration:underline;}
.drawer-foot{padding:16px 18px; border-top:1px solid var(--line); background:var(--surface);}
.total-row{display:flex; justify-content:space-between; font-size:15px; margin-bottom:12px;}
.total-row b{font-family:'Tajawal',sans-serif; font-size:18px; font-weight:700; color:var(--walnut);}
.checkout-btn{
  width:100%; padding:13px 0; border:none; border-radius:10px;
  background:var(--brick); color:#fff; font-family:'Tajawal',sans-serif;
  font-weight:700; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
}
.checkout-btn:disabled{opacity:.5; cursor:not-allowed;}

.delivery-note{
  background:var(--cream); border:1px dashed var(--gold);
  border-radius:9px; padding:9px 12px; margin-bottom:12px;
  font-size:12px; color:var(--walnut); line-height:1.7; text-align:center;
}

/* ===== Toast ===== */
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--walnut); color:#fff; padding:11px 22px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:0 6px 18px rgba(43,35,26,.25);
  z-index:90; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ===== Order tag modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(43,35,26,.55); z-index:70;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.open{display:flex;}
.tag{
  background:var(--surface); width:min(380px,100%); border-radius:6px;
  position:relative; padding:26px 24px 22px;
  border:2px dashed var(--gold);
}
.tag::before{
  content:''; position:absolute; top:50%; right:-9px; transform:translateY(-50%);
  width:18px; height:18px; background:var(--cream); border-radius:50%; border:2px dashed var(--gold);
}
.tag h3{font-family:'Tajawal',sans-serif; font-size:19px; font-weight:700; margin:0 0 4px; color:var(--walnut);}
.tag p.sub{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:5px; color:var(--ink);}
.field input{width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-family:'Tajawal',sans-serif; font-size:14px; background:var(--cream);}
.tag-summary{border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:10px 0; margin:14px 0; font-size:12.5px; color:var(--ink-soft); max-height:110px; overflow-y:auto;}
.tag-summary div{display:flex; justify-content:space-between; padding:2px 0;}
.modal-actions{display:flex; gap:10px;}
.modal-actions button{flex:1; padding:11px 0; border-radius:9px; font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px; cursor:pointer;}
.btn-cancel{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
.btn-send{background:#25D366; border:none; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px;}

footer{max-width:1100px; margin:0 auto; padding:18px 20px 30px; text-align:center;}
footer p{font-size:12px; color:var(--ink-soft); margin:10px 0 0;}

/* ===== Password gate ===== */
#gateOverlay{
  position:fixed; inset:0; z-index:999;
  background:var(--cream);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.gate-box{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  max-width:340px; width:100%; padding:32px 28px; text-align:center;
}
.gate-badge{
  width:54px; height:54px; border-radius:50%; border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  background:var(--surface);
}
.gate-badge span{font-family:'Cinzel',serif; font-weight:600; font-size:20px; color:var(--gold);}
.gate-box h2{font-family:'Cinzel',serif; font-size:19px; color:var(--walnut); margin:0 0 8px; letter-spacing:1px;}
.gate-box p{font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.6;}
.gate-box input{
  width:100%; padding:11px 14px; border-radius:9px; border:1px solid var(--line);
  background:var(--cream); font-family:'Tajawal',sans-serif; font-size:16px; text-align:center;
  letter-spacing:4px; margin-bottom:12px;
}
.gate-box input:focus{outline:1.5px solid var(--gold);}
.gate-box button{
  width:100%; padding:11px 0; border:none; border-radius:9px;
  background:var(--walnut); color:#fff; font-family:'Tajawal',sans-serif; font-weight:700; font-size:14px;
  cursor:pointer;
}
.gate-error{color:var(--brick); font-size:12.5px; margin-top:10px; display:none;}

@media (max-width:480px){
  .header-top{flex-wrap:wrap;}
  .search-wrap{max-width:none; order:3; flex:1 1 100%;}
  .hero{padding:16px 14px 14px;}
  .grid{grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px;}
  .cart-fab{left:12px; bottom:12px; padding:11px 16px 11px 14px; font-size:13.5px;}
  .tag{padding:22px 18px 18px;}
}
</style>
</head>
<body>

<div id="gateOverlay">
  <div class="gate-box">
    <div class="gate-badge"><span>LT</span></div>
    <h2>الموقع قيد التجهيز</h2>
    <p>عم نجهز الكتالوج، لسا مش جاهز للزوار.<br>إذا معك كلمة السر، فوتي.</p>
    <input id="gatePassword" type="password" inputmode="numeric" placeholder="••••" maxlength="10">
    <button id="gateSubmit">دخول</button>
    <p class="gate-error" id="gateError">كلمة السر غلط، حاولي مرة تانية</p>
  </div>
</div>

<header>
  <div class="header-top">
    <div class="brand">
      <div class="lt-badge"><span>LT</span></div>
      <div class="brand-text">
        <span class="name">Laval Trendz</span>
      </div>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="دور على موديل...">
        <span class="search-icon">⌕</span>
      </div>
      <button class="lang-toggle" id="langToggle">EN</button>
    </div>
  </div>
  <div class="cats-row" id="catsRow"></div>
</header>

<div class="delivery-banner" id="deliveryBanner"></div>

<div class="hero">
  <img src="images/lt-logo-lockup.jpg" alt="Laval Trendz — نتميز.... لتتألقي / Crafted to make you shine">
  <p class="brand-story" id="brandStory"></p>
</div>

<div class="social-row">
  <a href="https://instagram.com/CHANGE_ME" target="_blank">Instagram</a>
  <a href="https://facebook.com/CHANGE_ME" target="_blank">Facebook</a>
</div>

<main>
  <p class="count-line" id="countLine"></p>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <p id="footerText">Laval Trendz © 2026 — نتميز.... لتتألقي</p>
</footer>

<button class="cart-fab" id="cartFab"><span id="cartFabLabel">🛍 سلتي</span> <span class="badge" id="cartBadge">0</span></button>

<div class="toast" id="toast"></div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" id="lightboxClose">×</button>

</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">

  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="tag">

    <p class="sub" id="tagSubText">عبّي بياناتك وبنحولك على واتساب فوراً</p>
    <div class="field">
      <label id="nameLabelText">الاسم <span style="color:var(--brick)">*</span></label>
      <input id="custName" type="text" placeholder="اسمك">
    </div>
    <div class="field">
      <label id="phoneLabelText">رقم الجوال <span style="color:var(--brick)">*</span></label>
      <input id="custPhone" type="tel" placeholder="07XXXXXXXX">
    </div>
    <div class="field">
      <label id="cityLabelText">المدينة / المنطقة (اختياري)</label>
      <input id="custCity" type="text" placeholder="مثال: عمّان - جبل الحسين">

      <label id="notesLabelText">ملاحظات (اختياري)</label>

    <div class="tag-summary" id="tagSummary"></div>

    <div class="total-row"><span id="tagTotalLabelText">الإجمالي</span><b id="tagTotal">0 د.أ</b></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelModal"><span id="cancelBtnText">رجوع</span></button>

<script>
/* =====================================================
   بوابة كلمة السر — عدّلي كلمة السر هون
   لما تخلصي وتصير جاهزة تفتحي الموقع للكل، احذفي هاد الجزء كامل
   (من هون لحد نهاية هاد السكريبت) وامسحي #gateOverlay من الـ HTML فوق
===================================================== */
const GATE_PASSWORD = "2480";

(function(){
  const overlay = document.getElementById('gateOverlay');
  const input = document.getElementById('gatePassword');
  const btn = document.getElementById('gateSubmit');
  const err = document.getElementById('gateError');

  if(sessionStorage.getItem('lt_unlocked') === 'true'){
    overlay.style.display = 'none';
  }

  function tryUnlock(){
    if(input.value.trim() === GATE_PASSWORD){
      sessionStorage.setItem('lt_unlocked', 'true');
      overlay.style.display = 'none';
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryUnlock(); });
})();
</script>

let PRODUCTS = [];

/* CSV parser بسيط بيدعم الفواصل جوا نص محاط بعلامات اقتباس */
function parseCSV(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field.length || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToProducts(text){
  const rows = parseCSV(text);
  if(rows.length < 2) return [];
  const header = rows[0].map(h=>h.trim());
  const idx = name => header.indexOf(name);
  const iId=idx('id'), iNameAr=idx('nameAr'), iNameEn=idx('nameEn'), iPrice=idx('price'),
        iCat=idx('categoryKey'), iImg=idx('img'), iBadge=idx('badge'),
        iSizeAr=idx('sizeAr'), iSizeEn=idx('sizeEn'), iStock=idx('stock');
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.every(c=>(c||'').trim()==='')) continue;
    const stockRaw = iStock>-1 ? (row[iStock]||'').trim() : '';
    out.push({
      id: Number(row[iId]) || (r+1000),
      nameAr: (row[iNameAr]||'').trim(),
      nameEn: (row[iNameEn]||'').trim(),
      price: Number(row[iPrice]) || 0,
      categoryKey: (row[iCat]||'').trim(),
      img: (row[iImg]||'').trim(),
      badge: ((row[iBadge]||'').trim()) || null,
      sizeAr: (iSizeAr>-1 && (row[iSizeAr]||'').trim()) ? row[iSizeAr].trim() : null,
      sizeEn: (iSizeEn>-1 && (row[iSizeEn]||'').trim()) ? row[iSizeEn].trim() : null,
      stock: stockRaw === '' ? null : Number(stockRaw),
    });
  }
  return out;
}

async function loadProducts(){
  if(!GOOGLE_SHEET_CSV_URL){ PRODUCTS = FALLBACK_PRODUCTS; return; }
  try{
    const sep = GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?';
    const res = await fetch(GOOGLE_SHEET_CSV_URL + sep + 'cachebust=' + Date.now());
    if(!res.ok) throw new Error('fetch failed: ' + res.status);
    const text = await res.text();
    const parsed = csvToProducts(text);
    PRODUCTS = parsed.length ? parsed : FALLBACK_PRODUCTS;
  }catch(e){
    console.warn('تعذر تحميل المنتجات من جوجل شيت، رح نعرض النسخة المحفوظة بالكود.', e);
    PRODUCTS = FALLBACK_PRODUCTS;
  }
}

}

function filteredProducts(){
  return PRODUCTS.filter(p=>{
    const matchesCat = activeCategory==="all" || p.categoryKey===activeCategory;
    const matchesSearch = prodName(p).includes(searchTerm.trim());
    const inStock = (p.stock === null || p.stock === undefined) || p.stock > 0;
    return matchesCat && matchesSearch && inStock;
  });
}

function badgeLabel(b){
  if(b==='new') return t().badgeNew;
  if(b==='best') return t().badgeBest;
  return '';
}

function renderGrid(){
  const list = filteredProducts();
  document.getElementById('countLine').textContent = `${list.length} ${t().countSuffix}`;
  const grid = document.getElementById('grid');

  if(list.length === 0){
    grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--ink-soft); padding:50px 20px; font-size:14px;">${t().emptySearch}</p>`;
    return;
  }

  grid.innerHTML = list.map(p=>{
    const qty = cart[p.id]?.qty || 0;
    return `
    <div class="card">
      <div class="card-img" data-img="${p.img}" data-name="${prodName(p)}">
        <img src="${p.img}" alt="${prodName(p)}" loading="lazy">
        ${p.badge ? `<span class="card-badge">${badgeLabel(p.badge)}</span>` : ''}
      </div>
      <div class="card-body">
        <span class="card-cat">${catLabel(p.categoryKey)}</span>
        <p class="card-name">${prodName(p)}</p>
        ${(lang==='ar' ? p.sizeAr : p.sizeEn) ? `<span class="card-size">${lang==='ar' ? p.sizeAr : p.sizeEn}</span>` : ''}
        ${(p.stock !== null && p.stock !== undefined && p.stock <= 3) ? `<span class="card-stock">${lang==='ar' ? 'باقي '+p.stock+' قطع فقط' : 'Only '+p.stock+' left'}</span>` : ''}
        <span class="card-price">${fmt(p.price)}</span>
        ${qty===0
          ? `<button class="add-btn" data-id="${p.id}">${t().addBtn}</button>`
          : `<div class="qty-row">
               <button data-id="${p.id}" data-act="minus">−</button>
               <span>${qty}</span>
               <button data-id="${p.id}" data-act="plus">+</button>
             </div>`
        }
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.add-btn').forEach(b=>{
    b.addEventListener('click', ()=> changeQty(Number(b.dataset.id), 1));
  });
  grid.querySelectorAll('.qty-row button').forEach(b=>{
    b.addEventListener('click', ()=> changeQty(Number(b.dataset.id), b.dataset.act==='plus'?1:-1));
  });
  grid.querySelectorAll('.card-img').forEach(el=>{
    el.addEventListener('click', ()=> openLightbox(el.dataset.img, el.dataset.name));
  });
}

function changeQty(id, delta){
  const product = PRODUCTS.find(p=>p.id===id);
  if(!cart[id]) cart[id] = {product, qty:0};
  cart[id].qty += delta;
  if(cart[id].qty<=0) delete cart[id];
  if(delta > 0) showToast(t().addedToast);
  renderGrid();
  renderCartBadge();
  renderDrawer();
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

function cartCount(){ return Object.values(cart).reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return Object.values(cart).reduce((s,i)=>s+i.qty*i.product.price,0); }

function renderCartBadge(){
  document.getElementById('cartBadge').textContent = cartCount();
}

function renderDrawer(){
  const body = document.getElementById('drawerBody');
  const items = Object.values(cart);
  if(items.length===0){
    body.innerHTML = `<p class="empty-cart">${t().emptyCart}</p>`;
  } else {
    body.innerHTML = items.map(i=>`
      <div class="cart-item">
        <img src="${i.product.img}" alt="">
        <div class="ci-info">
          <p class="ci-name">${prodName(i.product)}</p>
          <span class="ci-price">${fmt(i.product.price)}</span>
          <div class="ci-controls">
            <button data-id="${i.product.id}" data-act="minus">−</button>
            <span>${i.qty}</span>
            <button data-id="${i.product.id}" data-act="plus">+</button>
            <button class="ci-remove" data-id="${i.product.id}" data-act="remove">${t().removeBtn}</button>
          </div>
        </div>
      </div>`).join('');
    body.querySelectorAll('button[data-act]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = Number(b.dataset.id);
        if(b.dataset.act==='remove'){ delete cart[id]; renderGrid(); renderCartBadge(); renderDrawer(); }
        else changeQty(id, b.dataset.act==='plus'?1:-1);
      });
    });
  }
  document.getElementById('drawerTotal').textContent = fmt(cartTotal());
  document.getElementById('checkoutBtn').disabled = items.length===0;
}

/* Drawer open/close */
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
function openDrawer(){ overlay.classList.add('open'); drawer.classList.add('open'); }
function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
document.getElementById('cartFab').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);

/* Lightbox */
const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
function openLightbox(src, alt){
  lightboxImg.src = src;
  lightboxImg.alt = alt;
  lightboxOverlay.classList.add('open');
}
document.getElementById('lightboxClose').addEventListener('click', ()=> lightboxOverlay.classList.remove('open'));
lightboxOverlay.addEventListener('click', (e)=>{ if(e.target===lightboxOverlay) lightboxOverlay.classList.remove('open'); });

/* Search */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  renderGrid();
});

/* ===== Order tag modal + WhatsApp handoff ===== */
const modalOverlay = document.getElementById('modalOverlay');

document.getElementById('checkoutBtn').addEventListener('click', ()=>{
  if(cartCount()===0) return;
  document.getElementById('tagSummary').innerHTML = Object.values(cart).map(i=>
    `<div><span>${prodName(i.product)} × ${i.qty}</span><span>${fmt(i.product.price*i.qty)}</span></div>`
  ).join('');
  document.getElementById('tagTotal').textContent = fmt(cartTotal());
  modalOverlay.classList.add('open');
});

document.getElementById('cancelModal').addEventListener('click', ()=>{
  modalOverlay.classList.remove('open');
});

document.getElementById('sendWhatsapp').addEventListener('click', ()=>{
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const city = document.getElementById('custCity').value.trim();
  const notes = document.getElementById('custNotes').value.trim();
  const errorMsg = document.getElementById('formError');
  const s = t();

  if(!name || !phone){
    errorMsg.textContent = s.formError;
    errorMsg.style.display = 'block';
    return;
  }
  errorMsg.style.display = 'none';

  let msg = `${s.waIntro}\n\n`;
  Object.values(cart).forEach(i=>{
    msg += `• ${prodName(i.product)} × ${i.qty} — ${fmt(i.product.price*i.qty)}\n`;
  });
  msg += `\n${s.waTotal}: ${fmt(cartTotal())}`;
  msg += `\n${s.waDelivery}`;
  msg += `\n${s.waName}: ${name}`;
  msg += `\n${s.waPhone}: ${phone}`;
  if(city) msg += `\n${s.waCity}: ${city}`;
  if(notes) msg += `\n${s.waNotes}: ${notes}`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
});

/* Init */
async function init(){
  applyStaticText();
  document.getElementById('countLine').textContent = lang==='ar' ? 'جاري تحميل المنتجات...' : 'Loading products...';
  await loadProducts();
  renderCats();
  renderGrid();
  renderCartBadge();
  renderDrawer();
}
init();
</script>
</body>
</html>
